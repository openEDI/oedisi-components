name: Unit Test - pnnl-emt-swod

on:
  push:
    branches: [ main ]
    paths:
      - 'Components/pnnl-emt-swod/**'
      - '.github/workflows/unit-test-pnnl-emt-swod.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Components/pnnl-emt-swod/**'
      - '.github/workflows/unit-test-pnnl-emt-swod.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e Components/pnnl-emt-swod[dev,test]

    - name: Run tests with pytest
      run: |
        pytest Components/pnnl-emt-swod/tests/ -v --cov=pnnl_emt_swod --cov-report=term
      env:
        PYTEST_ADDOPTS: "--color=yes"
