name: Unit Test - pnnl-anon-dp

on:
  push:
    branches: [ main ]
    paths:
      - 'Components/pnnl-anon-dp/**'
      - '.github/workflows/unit-test-pnnl-anon-dp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Components/pnnl-anon-dp/**'
      - '.github/workflows/unit-test-pnnl-anon-dp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e Components/pnnl-anon-dp[dev]

    - name: Run tests with pytest
      run: |
        pytest Components/pnnl-anon-dp/tests/ -v --cov=pnnl_anon_dp --cov-report=term
      env:
        PYTEST_ADDOPTS: "--color=yes"
